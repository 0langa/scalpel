name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.0.0 (defaults to the pushed tag)
        required: false
        type: string

jobs:
  build-assets:
    name: Build release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm pack
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash scalpel-${{ env.VERSION }}.tgz -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: scalpel-${{ env.VERSION }}-release-assets
          path: |
            scalpel-${{ env.VERSION }}.tgz
            SHA256SUMS.txt
