name: Hardening

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expanded:
        description: Run expanded public corpora
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  hardening:
    name: Hardening (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set hardening root
        shell: bash
        run: echo "SCALPEL_HARDENING_ROOT=${{ runner.temp }}/scalpel-hardening" >> "$GITHUB_ENV"
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run starter hardening
        if: ${{ inputs.expanded != 'true' }}
        run: pnpm hardening:all
      - name: Run expanded hardening
        if: ${{ inputs.expanded == 'true' }}
        run: pnpm hardening:all -- --expanded
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scalpel-hardening-${{ matrix.os }}
          path: ${{ env.SCALPEL_HARDENING_ROOT }}/reports
          if-no-files-found: ignore
